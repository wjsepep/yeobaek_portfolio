<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="description" content="yeobaek portfolio" />
    <title>yeobaek — 여백</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      html,
      body {
        margin: 0;
        padding-top: 72px;
        background: #ffffff !important;
        scroll-behavior: smooth;
      }

      main {
        margin-top: 0 !important;
      }

      #gallery {
        margin-top: 0 !important;
        padding-top: 0 !important;
        background: #ffffff !important;
      }

      #gallery,
      #video-gallery {
        scroll-margin-top: 88px;
      }

      .topbar {
        display: flex !important;
        position: fixed !important;
        top: 0 !important;
        right: 0 !important;
        left: 0 !important;
        box-sizing: border-box !important;
        width: 100% !important;
        min-height: 72px !important;
        align-items: center !important;
        justify-content: space-between !important;
        padding: 16px clamp(32px, 6vw, 88px) !important;
        background: #ffffff !important;
        color: #111 !important;
        visibility: visible !important;
        opacity: 1 !important;
        transform: none !important;
        z-index: 1000;
      }

      .topbar a,
      .topbar button {
        color: #111111 !important;
      }

      .topbar .brand {
        color: #111111 !important;
        opacity: 1 !important;
      }

      .topnav {
        display: flex !important;
        align-items: center !important;
        gap: 20px !important;
      }

      .topnav__link,
      .topnav__contact {
        display: inline-flex !important;
        align-items: center !important;
        color: #111111 !important;
        background: transparent !important;
        opacity: 1 !important;
        text-decoration: none !important;
        white-space: nowrap;
      }

      body.splash-active {
        overflow: hidden;
      }

      .splash-screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #ffffff;
        color: #111111;
        opacity: 1;
        visibility: visible;
        transition:
          opacity 0.4s ease,
          visibility 0.4s ease;
        z-index: 9999;
      }

      .splash-screen.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .splash-screen__brand {
        color: #111111;
        font-family: "Space Grotesk", sans-serif;
        font-size: clamp(0.9rem, 2vw, 1.75rem);
        font-weight: 500;
        letter-spacing: -0.04em;
      }

      .selected-gallery__grid figure img,
      .video-card > button {
        cursor: zoom-in;
      }

      .selected-video-gallery__grid .video-gallery-extra {
        display: none;
      }

      .selected-video-gallery__grid .video-gallery-extra.is-visible {
        display: block;
        animation: media-content-in 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .video-modal,
      .image-modal {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(0, 0, 0, 0.86);
        z-index: 2000;
        animation: media-modal-in 0.3s ease both;
      }

      .video-modal[hidden],
      .image-modal[hidden] {
        display: none;
      }

      .video-modal > div,
      .image-modal > div {
        position: relative;
        display: grid;
        gap: 12px;
        width: min(92vw, 1200px);
        max-height: 92vh;
        animation: media-content-in 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .video-modal video,
      .image-modal img {
        display: block;
        width: 100%;
        max-height: 82vh;
        object-fit: contain;
      }

      .video-modal p,
      .image-modal p {
        margin: 0;
        color: #ffffff;
        text-align: center;
      }

      .video-close,
      .image-close {
        position: absolute;
        top: 20px;
        right: 24px;
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 50%;
        background: #ffffff;
        color: #111111;
        font-size: 30px;
        line-height: 1;
        cursor: pointer;
        z-index: 1;
      }

      .video-close:hover,
      .image-close:hover {
        transform: scale(1.08);
      }

      @keyframes media-modal-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes media-content-in {
        from {
          opacity: 0;
          transform: scale(0.88) translateY(16px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .video-modal,
        .image-modal,
        .video-modal > div,
        .image-modal > div {
          animation: none;
        }
      }
    </style>
  </head>

    <!-- Video modal -->
    <div
      id="videoModal"
      class="video-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="videoTitle"
      hidden
    >
      <button
        id="videoClose"
        class="video-close"
        type="button"
        aria-label="영상 모달 닫기"
      >
        ×
      </button>
      <div>
        <video id="videoPlayer" controls playsinline></video>
        <p id="videoTitle"></p>
      </div>
    </div>

    <!-- Image modal -->
    <div
      id="imageModal"
      class="image-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="imageTitle"
      hidden
    >
      <button
        id="imageClose"
        class="image-close"
        type="button"
        aria-label="사진 팝업 닫기"
      >
        ×
      </button>
      <div>
        <img id="imageViewer" src="" alt="" />
        <p id="imageTitle"></p>
      </div>
    </div>

    <script src="js/main.js"></script>
    <script>
      (() => {
        const imageModal = document.getElementById("imageModal");
        const imageViewer = document.getElementById("imageViewer");
        const imageTitle = document.getElementById("imageTitle");
        const imageClose = document.getElementById("imageClose");
        const videoModal = document.getElementById("videoModal");
        const videoPlayer = document.getElementById("videoPlayer");
        const videoTitle = document.getElementById("videoTitle");
        const videoClose = document.getElementById("videoClose");

        const closeModal = (modal, video = null) => {
          if (!modal) return;
          modal.hidden = true;
          document.body.style.overflow = "";
          if (video) {
            video.pause();
            video.removeAttribute("src");
            video.load();
          }
        };

        document
          .querySelectorAll(".selected-gallery__grid figure img")
          .forEach((image) => {
            image.addEventListener("click", () => {
              imageViewer.src = image.currentSrc || image.src;
              imageViewer.alt = image.alt;
              imageTitle.textContent =
                image.closest("figure")?.querySelector("figcaption")
                  ?.textContent || "";
              imageModal.hidden = false;
              document.body.style.overflow = "hidden";
            });
          });

        document.querySelectorAll(".video-card > button").forEach((button) => {
          button.addEventListener("click", (event) => {
            event.preventDefault();
            const source = button.dataset.video;
            if (!source || !videoPlayer) return;

            document
              .querySelectorAll(".video-card video")
              .forEach((preview) => preview.pause());
            videoPlayer.src = source;
            videoTitle.textContent = button.dataset.title || "";
            videoModal.hidden = false;
            document.body.style.overflow = "hidden";
            videoPlayer.play().catch(() => {});
          });
        });

        const videoGalleryMore = document.querySelector(".video-gallery-more");
        const extraVideoCards = document.querySelectorAll(
          ".selected-video-gallery__grid .video-gallery-extra",
        );

        videoGalleryMore?.addEventListener(
          "click",
          (event) => {
            event.preventDefault();
            event.stopImmediatePropagation();
            const isExpanded =
              videoGalleryMore.getAttribute("aria-expanded") === "true";

            extraVideoCards.forEach((card) => {
              card.classList.toggle("is-visible", !isExpanded);
            });
            videoGalleryMore.setAttribute("aria-expanded", String(!isExpanded));
            videoGalleryMore.innerHTML = isExpanded
              ? '영상 더 보기 <span aria-hidden="true">+</span>'
              : '영상 접기 <span aria-hidden="true">−</span>';
          },
          true,
        );

        imageClose?.addEventListener("click", () => closeModal(imageModal));
        videoClose?.addEventListener("click", () =>
          closeModal(videoModal, videoPlayer),
        );

        [imageModal, videoModal].forEach((modal) => {
          modal?.addEventListener("click", (event) => {
            if (event.target === modal) {
              closeModal(modal, modal === videoModal ? videoPlayer : null);
            }
          });
        });

        document.addEventListener("keydown", (event) => {
          if (event.key !== "Escape") return;
          closeModal(imageModal);
          closeModal(videoModal, videoPlayer);
        });
      })();
    </script>
    <script>
      window.setTimeout(() => {
        const splashScreen = document.getElementById("splashScreen");

        splashScreen?.classList.add("is-hidden");
        document.body.classList.remove("splash-active");

        window.setTimeout(() => {
          splashScreen?.remove();
        }, 300);
      }, 500);
    </script>
  </body>
</html>
